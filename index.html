      background: rgba(0, 0, 0, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.4);
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.06);
    }

    body.dark-mode .theme-toggle {
      background: rgba(0, 0, 0, 0.3);
      border-color: rgba(255, 255, 255, 0.1);
    }

    .theme-toggle-knob {
      width: 32px;
      height: 32px;
      border-radius: 999px;
      position: absolute;
      left: 4px;
      top: 4px;
      display: grid;
      place-items: center;
      background: #ffffff;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.15);
      transition: left 0.3s var(--ease-spring);
    }

    body.dark-mode .theme-toggle-knob {
      background: #1e293b;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.4);
    }

    .main,
    .pages,
    .page {
      width: 100%;
      height: 100%;
      min-height: 0;
      overflow: hidden;
    }

    .page {
      display: none;
    }

    .page.active {
      display: block;
    }

    .page-scroll {
      width: 100%;
      height: 100%;
      overflow: auto;
      overscroll-behavior-y: contain;
      padding: 2px;
    }

    .dashboard-scroll,
    #calendar .page-scroll {
      overflow: hidden;
    }

    .dashboard-layout {
      width: 100%;
      height: 100%;
      min-height: 0;
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
      gap: var(--gap);
    }

    /* +----------------------------------+
     * + DASHBOARD HERO                   +
     * +----------------------------------+ */
    .display-board {
      position: relative;
      overflow: hidden;
      border-radius: var(--radius-xl);
      min-height: clamp(168px, 23vh, 290px);
      padding: clamp(22px, 3.2vw, 56px) clamp(24px, 4.6vw, 86px);
      display: grid;
      grid-template-columns: minmax(280px, .9fr) minmax(340px, 1.1fr);
      gap: clamp(22px, 4vw, 76px);
      align-items: center;
    }

    .display-board-left {
      display: grid;
      gap: clamp(9px, .9vw, 16px);
      align-content: center;
    }

    /* Daily quote floats in the original open space between the clock/info and HOAG card. */
    .display-daily-quote {
      position: absolute;
      z-index: 3;
      left: 30.1%;
      top: 62%;
      width: min(25%, 460px);
      min-width: 180px;
      transform: translate(-50%, -50%);
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 8px 14px;
      overflow: hidden;
      pointer-events: none;
    }

    .display-daily-quote[hidden] {
      display: none !important;
    }

    .display-daily-quote-text {
      max-width: 100%;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      font-size: clamp(11px, .82vw, 16px);
      font-weight: 600;
      line-height: 1.35;
      letter-spacing: -0.01em;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 3;
      overflow: hidden;
      text-wrap: balance;
    }

    .display-daily-quote-author {
      margin-top: 5px;
      color: var(--muted);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      font-size: clamp(10px, .55vw, 12px);
      font-weight: 600;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }

    .display-time-block {
      position: relative;
    }

    .display-title,
    .display-clock,
    .display-hero-title,
    .display-title-clock {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      color: var(--text);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.02em;
    }

    .display-title-clock {
      max-width: 100%;
      font-size: var(--type-clock);
      letter-spacing: -0.04em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .display-hero-title {
      max-width: 100%;
      font-size: var(--type-hero);
      text-align: center;
      text-transform: uppercase;
      overflow: hidden;
      text-overflow: ellipsis;
      overflow-wrap: anywhere;
      transition: transform .42s var(--ease-spring), filter .34s var(--ease-smooth), text-shadow .34s var(--ease-smooth);
      will-change: transform;
    }

    .display-accent-line {
      width: 58px;
      height: 4px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--primary), var(--primary-2));
    }

    .display-date {
      width: fit-content;
      max-width: 100%;
      border-radius: 999px;
      padding: 7px 14px;
      font-size: var(--type-small);
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: .04em;
      color: var(--muted);
      box-shadow: var(--shadow-soft);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .display-greeting {
      max-width: 100%;
      color: var(--text);
      font-weight: 700;
      font-size: var(--type-body);
      line-height: 1.35;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .greeting-icon {
      margin-left: 5px;
    }

    .display-clock-wrap {
      min-height: clamp(118px, 15vh, 200px);
      border-radius: var(--radius-xl);
      padding: clamp(16px, 1.5vw, 26px);
      display: grid;
      place-items: center;
      overflow: hidden;
      position: relative;
      isolation: isolate;
      contain: layout paint;
      transform: translateZ(0);
      cursor: default;
    }

    .stats-row,
    .bottom-cards-row,
    .setting-grid {
      width: 100%;
      display: grid;
      gap: var(--gap);
    }

    .stats-row,
    .bottom-cards-row {
      grid-template-columns: repeat(4, minmax(130px, 1fr));
    }

    .stat-card,
    .bottom-card,
    .setting-box,
    .profile-info-box,
    .leave-course-year-card {
      position: relative;
      overflow: hidden;
      border-radius: var(--radius-lg);
      transition: transform 0.3s var(--ease-spring), box-shadow 0.3s var(--ease-smooth), border-color 0.2s var(--ease-smooth);
    }

    .stat-card {
      min-height: clamp(78px, 10vh, 118px);
      padding: clamp(13px, 1vw, 20px);
      display: grid;
      place-items: center;
      text-align: center;
    }

    .dashboard-icon-wrap {
      width: 100%;
      max-width: 100%;
      min-height: 0;
      display: grid;
      grid-template-rows: auto auto;
      place-items: center;
      align-content: center;
      gap: clamp(5px, .65vh, 8px);
    }

    .dashboard-card-icon {
      display: block;
      max-width: 100%;
      font-size: var(--icon-stat);
      line-height: 1;
    }

    .dashboard-card-title {
      max-width: 100%;
      font-size: var(--type-dashboard-label);
      color: var(--muted);
      font-weight: 800;
      line-height: 1.2;
      letter-spacing: .06em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-transform: uppercase;
    }

    .bottom-cards-row {
      min-height: 0;
    }

    .bottom-card {
      min-height: 0;
      padding: clamp(15px, 1.25vw, 24px);
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
      align-content: start;
      justify-items: start;
      gap: clamp(10px, .9vw, 16px);
    }

    .big-card-icon {
      width: var(--icon-card-size);
      height: var(--icon-card-size);
      border-radius: 50%;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      font-size: var(--icon-card-font);
      line-height: 1;
      box-shadow: var(--shadow-soft);
      background: rgba(255, 255, 255, 0.5);
    }

    body.dark-mode .big-card-icon {
      background: rgba(255, 255, 255, 0.08);
    }

    .big-card-icon-wrap {
      width: 100%;
      max-width: 100%;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: flex-start;
    }

    .bottom-card-title,
    .profile-card h3,
    .panel h3 {
      color: var(--text);
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -0.01em;
    }

    .bottom-card-title {
      max-width: 100%;
      font-size: var(--type-card-title);
      overflow: hidden;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      overflow-wrap: anywhere;
    }

    .bottom-card-desc,
    .panel p,
    .profile-card p {
      max-width: 100%;
      font-size: var(--type-body);
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    :is(#profile, #access) .profile-card>p {
      min-height: calc(2 * 1.5em);
      overflow: hidden;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      line-clamp: 2;
    }

    /* +------------------------------------------+
     * + PROFILE / ACCESS / YEAR CARD FOUNDATIONS +
     * +------------------------------------------+ */

    .access-three-cards,
    .leave-course-years-wrap {
      width: 100%;
      height: 100%;
      min-height: 0;
      display: grid;
      gap: var(--gap);
    }

    .profile-two-cards,
    .leave-course-years-wrap {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .access-three-cards {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .profile-card,
    .panel {
      height: 100%;
      min-height: 0;
      overflow: hidden;
      border-radius: var(--radius-xl);
      padding: clamp(16px, 1.25vw, 26px);
    }

    .profile-card {
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
      gap: var(--page-title-description-gap);
    }

    .profile-card h3,
    .panel h3 {
      max-width: 100%;
      font-size: var(--type-panel-title);
      overflow: hidden;
      text-overflow: ellipsis;
      overflow-wrap: anywhere;
    }

    .profile-info-grid,
    .content-inner {
      min-height: 0;
      overflow: auto;
    }

    .profile-info-grid {
      display: grid;
      align-content: start;
      gap: clamp(10px, .9vw, 15px);
      padding-right: 4px;
    }

    #profile .profile-link-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      grid-auto-rows: clamp(92px, 8.2vh, 104px);
      align-content: start;
      align-items: stretch;
      overflow-x: hidden;
      overflow-y: auto;
    }

    /* +----------------------------------+
     * + PROFILE + ACCESS LINKS           +
     * +----------------------------------+ */
    #profile .profile-link-card,
    #access .access-link-card {
      display: grid;
      grid-template-columns: clamp(36px, 2.35vw, 48px) minmax(0, 1fr);
      grid-template-rows: auto auto;
      column-gap: clamp(10px, .85vw, 14px);
      align-content: center;
      align-items: center;
      justify-items: start;
      width: 100%;
      height: 100%;
      min-height: clamp(64px, 6.4vh, 82px);
      align-self: stretch;
      color: inherit;
      text-decoration: none;
      cursor: pointer;
      border-radius: var(--radius-lg);
      border: var(--glass-border);
      background: var(--glass);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      box-shadow: var(--shadow-soft);
      padding: 12px 16px;
      transition: transform 0.3s var(--ease-spring), box-shadow 0.3s var(--ease-smooth);
    }

    #profile .profile-link-card:hover,
    #access .access-link-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--viewport-safe-hover-shadow);
    }

    #profile .profile-link-card::before,
    #access .access-link-card::before {
      content: attr(data-icon);
      grid-column: 1;
      grid-row: 1 / span 2;
      width: clamp(34px, 2.2vw, 46px);
      height: clamp(34px, 2.2vw, 46px);
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: rgba(255, 255, 255, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: var(--shadow-soft);
      font-size: clamp(16px, 1.15vw, 22px);
      line-height: 1;
    }

    body.dark-mode #profile .profile-link-card::before,
    body.dark-mode #access .access-link-card::before {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.12);
    }

    #profile .profile-link-card strong,
    #profile .profile-link-card span,
    #access .access-link-card strong,
    #access .access-link-card span {
      grid-column: 2;
      min-width: 0;
    }

    #profile .profile-link-card strong,
    #access .access-link-card strong {
      align-self: end;
      min-height: 1.25em;
      margin-bottom: 0;
    }

    #profile .profile-link-card span,
    #access .access-link-card span {
      align-self: start;
    }

    /* +----------------------------------+
     * + ACCESS LINKS                     +
     * +----------------------------------+ */
    #access .access-link-grid {
      grid-template-columns: minmax(0, 1fr);
      grid-auto-rows: clamp(92px, 8.2vh, 104px);
      align-content: start;
      align-items: stretch;
      overflow-x: hidden;
      overflow-y: auto;
    }


    /* +----------------------------------+
     * + QUICK LINKS                      +
     * +----------------------------------+ */
    #quickLinks .quick-links-card {
      display: grid;
      grid-template-columns: clamp(36px, 2.35vw, 48px) minmax(0, 1fr);

      column-gap: clamp(10px, .85vw, 14px);
      align-content: center;
      align-items: center;
      justify-items: start;
      width: 100%;
      height: 100%;
      min-height: clamp(64px, 6.4vh, 82px);
      align-self: stretch;
      color: inherit;
      text-decoration: none;
      cursor: pointer;
      border-radius: var(--radius-lg);
      border: var(--glass-border);
      background: var(--glass);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      box-shadow: var(--shadow-soft);
      padding: 12px 16px;
      transition: transform 0.3s var(--ease-spring), box-shadow 0.3s var(--ease-smooth);
    }

    #quickLinks .quick-links-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--viewport-safe-hover-shadow);
    }

    #quickLinks .quick-links-card::before {
      content: attr(data-icon);
      grid-column: 1;
      grid-row: 1 / span 2;
      width: clamp(34px, 2.2vw, 46px);
      height: clamp(34px, 2.2vw, 46px);
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: rgba(255, 255, 255, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: var(--shadow-soft);
      font-size: clamp(16px, 1.15vw, 22px);
      line-height: 1;
    }

    #quickLinks .quick-links-card strong,
    #quickLinks .quick-links-card span {
      grid-column: 2;
      min-width: 0;
    }

    #quickLinks .quick-links-card strong {
      align-self: end;
      min-height: 1.25em;
      margin-bottom: 0;
    }

    #quickLinks .quick-links-card span {
      align-self: start;
    }

    #quickLinks .quick-links-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      grid-auto-rows: clamp(92px, 8.2vh, 104px);
      align-content: start;
      align-items: stretch;
      margin-top: 24px;
      padding-top: 4px;
      padding-right: 4px;
      overflow: visible;
    }

    body.dark-mode #quickLinks .quick-links-card::before {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.12);
      box-shadow: var(--shadow-soft);
    }

    .profile-info-box,
    .setting-box {
      padding: clamp(12px, .95vw, 18px);
      box-shadow: var(--shadow-soft);
    }

    .profile-info-box strong,
    .setting-box strong {
      display: block;
      max-width: 100%;
      margin-bottom: 6px;
      color: var(--primary);
      font-size: var(--type-small);
      line-height: 1.25;
      overflow: hidden;
      text-overflow: ellipsis;
      overflow-wrap: anywhere;
    }


    .settings-standard-panel[hidden],
    .settings-admin-panel[hidden] {
      display: none !important;
    }

    .settings-standard-panel {
      height: 100%;
      min-height: 0;
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
      gap: var(--page-title-description-gap);
    }

    .settings-content-grid {
      min-height: 0;
      display: grid;
      grid-template-rows: auto auto auto;
      align-content: start;
      row-gap: 0;
      column-gap: 0;
      overflow: auto;
      padding: 18px 6px 24px;
    }

    .settings-content-grid .setting-grid {
      padding: 0;
      overflow: visible;
    }

    /* Settings information cards use the same icon-card language as UPDATE / DATA & SYNC / ABOUT. */
    #settings .setting-box {
      min-width: 0;
      min-height: 76px;
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr);
      grid-template-rows: auto auto;
      column-gap: 13px;
      align-content: center;
      align-items: center;
      padding: 14px 16px;
    }

    #settings .setting-box::before {
      content: attr(data-icon);
      grid-column: 1;
      grid-row: 1 / span 2;
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(0, 122, 255, 0.2);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.5);
      color: var(--primary);
      font-size: 21px;
      font-weight: 800;
      line-height: 1;

      min-width: 0;

    #settings .setting-box strong {
      align-self: end;
      margin-bottom: 4px;
    }

    #settings .setting-box span {
      align-self: start;
    }

    body.dark-mode #settings .setting-box::before {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.15);
    }

    .settings-extra-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));

      padding: 14px 16px;

      border-radius: var(--radius-lg);

      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      box-shadow: var(--shadow-soft);

      border-color: rgba(0, 122, 255, 0.4);

    .settings-extra-icon {
      flex: 0 0 42px;

      height: 42px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(0, 122, 255, 0.2);

      font-size: var(--type-small);

      color: var(--muted);

      overflow: hidden;

      border-color: rgba(255, 255, 255, 0.15);

      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));

      row-gap: 12px;
      margin-top: 0;

      min-height: 76px;

    #settings .setting-box strong {

      margin: 0 0 4px;

      font-size: var(--type-small);

    #settings .setting-box span {
      display: block;
      align-self: start;
      color: var(--muted);

      grid-template-columns: repeat(3, minmax(0, 1fr));
      column-gap: 14px;
      row-gap: 12px;
    }

    #settings .settings-extra-card {
      width: 100%;
      min-width: 0;
      min-height: 76px;
      box-sizing: border-box;
      padding: 14px 16px;
      border-radius: var(--radius-lg);
      text-align: left;
      justify-content: flex-start;
    }

    #settings .settings-extra-card .settings-extra-copy {
      text-align: left;
    }

    #settings .settings-extra-icon {
      font-size: 0;
    }

    body.dark-mode #settings .setting-box .settings-card-icon,
    body.dark-mode #settings .settings-extra-icon {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.15);
    }

    @media (max-width: 900px) {
      .settings-extra-grid {
        grid-template-columns: 1fr;
      }
    }

    .settings-admin-panel {
      height: 100%;
      min-height: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: clamp(12px, 1vw, 18px);
    }

    #settings .content-inner {
      height: 100%;
    }

    /* +----------------------------------+
     * + ADMIN CONTROL CENTER             +
     * +----------------------------------+ */
    .admin-control-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
    }

    .admin-control-head>div:first-child {
      display: grid;
      gap: var(--page-title-description-gap);
    }

    .admin-control-head h3 {
      margin-top: 0;
    }

    .admin-control-status {
      min-height: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      padding: 7px 13px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.45);
      border: var(--glass-border);
      box-shadow: var(--shadow-soft);
      font-size: var(--type-label);
      font-weight: 800;
      text-align: center;
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
    }

    .admin-control-status.is-error {
      color: #dc2626;
      background: rgba(254, 226, 226, 0.7);
    }

    .admin-control-status.is-ok {
      color: #16a34a;
      background: rgba(220, 252, 231, 0.7);
    }

    .admin-control-grid {
      width: 100%;
      height: 100%;
      min-height: 0;
      overflow: hidden;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      align-items: stretch;
      gap: var(--gap);
      padding: 2px 4px 8px;
    }

    .admin-control-column.is-tools,
    .admin-control-column.is-log {
      width: 100%;
      min-width: 0;
    }

    .admin-control-column {
      min-height: 0;
      overflow: hidden;
      border-radius: var(--radius-xl);
      padding: clamp(14px, 1.05vw, 22px);
      background: var(--glass);
      border: var(--glass-border);
      box-shadow: var(--shadow);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: clamp(12px, 1vw, 18px);
    }

    .admin-control-column.is-log {
      grid-template-rows: auto minmax(0, 1fr);
    }

    .admin-control-tools {
      height: 100%;
      min-height: 0;
      overflow: hidden;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      grid-template-rows: repeat(3, minmax(0, 1fr));
      grid-auto-flow: row;
      grid-auto-rows: minmax(0, 1fr);
      align-items: stretch;
      gap: var(--gap);
      padding-right: 4px;
      align-content: stretch;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .admin-control-tools::-webkit-scrollbar {
      width: 0;
      height: 0;
      display: none;
    }

    .admin-control-card {
      position: relative;
      min-height: 0;
      height: 100%;
      border-radius: var(--radius-lg);
      padding: clamp(12px, .85vw, 17px);
      background: rgba(255, 255, 255, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.5);
      box-shadow: var(--shadow-soft);
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: clamp(8px, .65vw, 11px);
      overflow: hidden;
      isolation: isolate;
    }

    body.dark-mode .admin-control-card {
      background: rgba(30, 41, 59, 0.4);
      border-color: rgba(255, 255, 255, 0.1);
    }

    .admin-card-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .admin-card-title strong {
      color: var(--text);
      font-size: var(--type-card-title);
      font-weight: 800;
      line-height: 1.15;
    }

    .admin-card-title span {
      color: var(--muted);
      font-size: var(--type-small);
      font-weight: 600;
    }

    .admin-form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .admin-form-grid .is-full {
      grid-column: 1 / -1;
    }

    .admin-input,
    .admin-select,
    .admin-textarea {
      width: 100%;
      min-height: clamp(36px, 2.15vw, 42px);
      border-radius: 14px;
      padding: 9px 13px;
      color: var(--text);
      background: rgba(255, 255, 255, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: var(--shadow-inset);
      outline: none;
      font: inherit;
      font-size: var(--type-small);
      font-weight: 600;
    }

    .admin-textarea {
      min-height: clamp(56px, 6.4vh, 92px);
      flex: 1 1 auto;
      resize: vertical;
      line-height: 1.45;
    }

    .admin-input:focus,
    .admin-select:focus,
    .admin-textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.25);
    }

    .admin-action-btn,
    .admin-danger-btn,
    .admin-muted-btn {
      min-height: clamp(32px, 2.05vw, 38px);
      border-radius: 999px;
      padding: 0 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      font-size: var(--type-label);
      font-weight: 800;
      line-height: 1;
      text-align: center;
      box-shadow: var(--shadow-soft);
      transition: transform .25s var(--ease-spring), box-shadow .25s var(--ease-smooth), opacity .2s var(--ease-smooth);
    }

    .admin-action-btn {
      color: #fff;
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      border: 1px solid rgba(255, 255, 255, .50);
    }

    .admin-danger-btn {
      color: #fff;
      background: linear-gradient(135deg, #ff3b30, #ff2d55);
      border: 1px solid rgba(255, 255, 255, .42);
    }

    .admin-muted-btn {
      color: var(--text);
      background: rgba(255, 255, 255, 0.4);
      border: var(--glass-border);
    }

    .admin-action-btn:hover,
    .admin-danger-btn:hover,
    .admin-muted-btn:hover {
      transform: translateY(-2px);
      box-shadow: var(--viewport-safe-hover-shadow);
    }

    .admin-action-btn:disabled,
    .admin-danger-btn:disabled,
    .admin-muted-btn:disabled {
      opacity: .65;
      cursor: wait;
      transform: none;
    }

    .admin-control-card>.admin-action-btn,
    .admin-control-card>.admin-danger-btn,
    .admin-control-card>.admin-muted-btn {
      position: static !important;
      flex: 0 0 auto;
      width: 100%;
      margin-top: auto;
      z-index: 1;
    }

    .admin-control-card>.admin-form-grid,
    .admin-control-card>.admin-textarea,
    .admin-control-card>.admin-toggle-row,
    .admin-control-card>.admin-card-actions,
    .admin-control-card>.admin-user-list {
      position: relative;
      z-index: 1;
    }

    .admin-toggle-row {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text);
      font-size: var(--type-small);
      font-weight: 700;
    }

    .admin-toggle-row input {
      width: 18px;
      height: 18px;
      accent-color: var(--primary);
    }

    .admin-card-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .admin-card-actions .admin-action-btn,
    .admin-card-actions .admin-danger-btn,
    .admin-card-actions .admin-muted-btn {
      flex: 1 1 130px;
    }

    .admin-user-list,
    .admin-log-list {
      min-height: 0;
      overflow: auto;
      display: grid;
      gap: 8px;
      padding-right: 4px;
      align-content: start;
    }

    .admin-user-list {
      flex: 1 1 auto;
      max-height: none;
    }

    .admin-log-list {
      height: 100%;
    }

    .admin-user-list,
    .admin-log-list {
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .admin-user-list::-webkit-scrollbar,
    .admin-log-list::-webkit-scrollbar {
      width: 0;
      height: 0;
      display: none;
    }

    .admin-user-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      grid-template-areas:
        "main role state"
        "actions actions actions";
      gap: 8px;
      align-items: center;
      border-radius: var(--radius-md);
      padding: 9px;
      color: var(--text);
      background: rgba(255, 255, 255, .38);
      border: 1px solid var(--line);
      box-shadow: var(--shadow-soft);
      overflow: visible;
    }

    .admin-user-main {
      grid-area: main;
      min-width: 0;
    }

    .admin-user-main span {
      overflow-wrap: anywhere;
    }

    .admin-user-role-pill {
      grid-area: role;
      justify-self: end;
    }

    .admin-user-state-pill {
      grid-area: state;
      justify-self: end;
    }

    .admin-user-main strong,
    .admin-log-row strong {
      display: block;
      color: var(--text);
      font-size: var(--type-small);
      font-weight: 800;
      line-height: 1.2;
    }

    .admin-user-main span,
    .admin-log-row span {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: var(--type-label);
      line-height: 1.35;
    }

    .admin-pill {
      width: fit-content;
      border-radius: 999px;
      padding: 6px 9px;
      font-size: 10px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: .06em;
      color: var(--primary);
      background: rgba(0, 122, 255, 0.12);
      border: 1px solid rgba(0, 122, 255, 0.25);
    }

    .admin-pill.is-off {
      color: #dc2626;
      background: rgba(254, 226, 226, .70);
      border-color: rgba(239, 68, 68, .22);
    }

    .admin-row-actions {
      grid-area: actions;
      width: 100%;
      min-width: 0;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      align-items: center;
      gap: 7px;
    }

    .admin-row-actions button {
      width: 100%;
      min-width: 0;
      min-height: 30px;
      border-radius: 999px;
      padding: 0 8px;
      font-size: 10px;
      font-weight: 800;
    }

    .admin-log-row {
      border-radius: var(--radius-md);
      padding: 10px 12px;
      background: rgba(255, 255, 255, .34);
      border: 1px solid var(--line);
      box-shadow: var(--shadow-soft);
      display: grid;
      gap: 7px;
    }

    .admin-log-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .admin-log-time {
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      line-height: 1.25;
      white-space: nowrap;
    }

    .admin-log-detail {
      margin-top: 0 !important;
    }

    .admin-log-context {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    .admin-log-pill {
      max-width: 100%;
      border-radius: 999px;
      padding: 5px 8px;
      color: var(--primary);
      background: rgba(0, 122, 255, 0.12);
      border: 1px solid rgba(0, 122, 255, 0.2);
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .04em;
      line-height: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .admin-log-useragent {
      margin-top: 0 !important;
      font-size: 9px !important;
      opacity: .82;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .system-notice-toast {
      position: fixed;
      z-index: 70;
      right: clamp(14px, 1.5vw, 26px);
      top: clamp(14px, 1.5vw, 26px);
      max-width: min(420px, calc(100vw - 28px));
      border-radius: var(--radius-lg);
      padding: 13px 16px;
      color: var(--text);
      background: rgba(255, 255, 255, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.8);
      box-shadow: var(--shadow);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
    }

    .system-notice-toast.is-hidden {
      display: none;
    }

    .system-notice-toast strong {
      display: block;
      color: var(--primary);
      font-size: var(--type-small);
      font-weight: 800;
    }

    .system-notice-toast span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: var(--type-small);
      line-height: 1.45;
    }

    .app-modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 11000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0, 0, 0, 0.3);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
    }

    .app-modal-overlay.is-hidden {
      display: none;
    }

    .app-modal {
      width: min(420px, 100%);
      border-radius: var(--radius-xl);
      padding: 22px;
      color: var(--text);
      background: rgba(255, 255, 255, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.85);
      box-shadow: var(--shadow);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      text-align: center;
    }

    .app-modal strong {
      display: block;
      color: var(--primary);
      font-size: var(--type-card-title);
      font-weight: 800;
    }

    .app-modal span {
      display: block;
      margin-top: 8px;
      color: var(--muted);
      font-size: var(--type-small);
      line-height: 1.45;
    }

    .app-modal-actions {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 18px;
    }

    .app-modal-action {
      min-width: 104px;
      border-radius: 999px;
      padding: 10px 16px;
      font-size: var(--type-small);
      font-weight: 800;
      color: var(--text);
      background: rgba(255, 255, 255, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.7);
      box-shadow: var(--shadow-soft);
    }

    .app-modal-action.is-danger {
      color: #fff;
      background: linear-gradient(135deg, #ff3b30, #ff9500);
      border-color: rgba(255, 59, 48, 0.4);
    }

    body.dark-mode .admin-input,
    body.dark-mode .admin-select,
    body.dark-mode .admin-textarea,
    body.dark-mode .admin-user-row,
    body.dark-mode .admin-log-row {
      background: rgba(255, 255, 255, .055);
      border-color: rgba(255, 255, 255, .11);
    }

    body.dark-mode .admin-control-status,
    body.dark-mode .system-notice-toast {
      background: rgba(22, 30, 46, 0.75);
      border-color: rgba(255, 255, 255, .12);
    }

    body.dark-mode .app-modal {
      background: rgba(22, 30, 46, 0.85);
      border-color: rgba(255, 255, 255, .14);
    }

    body.dark-mode .app-modal-action {
      background: rgba(255, 255, 255, .08);
      border-color: rgba(255, 255, 255, .12);
    }


    /* +----------------------------------+
     * + RESPONSIVE LAYOUT                +
     * +----------------------------------+ */
    @media (max-width: 900px) {
      .admin-control-head {
        align-items: flex-start;
        flex-direction: column;
      }

      .admin-form-grid {
        grid-template-columns: minmax(0, 1fr);
      }

      .admin-user-row {
        grid-template-columns: minmax(0, 1fr);
        grid-template-areas:
          "main"
          "role"
          "state"
          "actions";
        align-items: start;
      }

      .admin-user-role-pill,
      .admin-user-state-pill {
        justify-self: start;
      }

      .admin-row-actions {
        justify-content: stretch;
      }
    }

    @media (max-width: 560px) {
      .admin-control-grid {
        grid-template-columns: minmax(0, 1fr);
        overflow: auto;
        scrollbar-width: none;
        -ms-overflow-style: none;
      }

      .admin-control-grid::-webkit-scrollbar {
        width: 0;
        height: 0;
        display: none;
      }

      .admin-control-column.is-tools,
      .admin-control-column.is-log {
        width: 100%;
        min-width: 0;
        min-height: 420px;
      }

      .admin-control-tools {
        overflow: auto;
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: none;
        grid-auto-rows: minmax(220px, auto);
        align-content: start;
      }

      .admin-control-card {
        height: auto;
        min-height: 220px;
      }
    }

    .setting-grid {
      margin-top: var(--gap);
      grid-template-columns: repeat(3, minmax(160px, 1fr));
    }

    .single-panel,
    .single-panel .panel,
    .calendar-single-panel,
    .calendar-panel,
    .calendar-content-inner,
    .calendar-roster-shell {
      width: 100%;
      height: 100%;
      min-height: 0;
    }

    .calendar-panel {
      padding: clamp(14px, 1vw, 22px);
    }

    .calendar-content-inner {
      overflow: hidden;
      padding: 0;
    }

    .calendar-roster-shell {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: clamp(10px, .9vw, 16px);
    }

    .calendar-roster-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 12px;
    }

    .calendar-kicker,
    .calendar-mini-kicker,
    .module-years-kicker,
    .leave-course-kicker {
      color: var(--primary);
      font-size: clamp(10px, .75vw, 12px);
      font-weight: 800;
      letter-spacing: .15em;
      text-transform: uppercase;
    }

    .calendar-roster-board {
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(300px, .82fr) minmax(420px, 1.18fr);
      gap: var(--gap);
    }

    .calendar-month-panel,
    .daily-roster-panel {
      min-height: 0;
      overflow: hidden;
      border-radius: var(--radius-xl);
      padding: clamp(12px, 1vw, 18px);
    }

    .calendar-month-panel {
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
      gap: clamp(8px, .8vw, 13px);
    }

    .calendar-month-topline,
    .daily-roster-toolbar,
    .module-years-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .calendar-mini-label,
    .calendar-selected-label {
      color: var(--text);
      font-size: clamp(15px, 1.1vw, 20px);
      font-weight: 800;
    }

    .calendar-month-actions,
    .calendar-roster-nav,
    .daily-roster-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .calendar-roster-nav-btn,
    .calendar-roster-month-btn,
    .calendar-roster-today-btn,
    .calendar-toolbar-btn,
    .roster-delete-btn,
    .page-back-dashboard-btn {
      min-height: clamp(32px, 2.05vw, 38px);
      border-radius: 999px;
      padding: 0 clamp(12px, .95vw, 15px);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      vertical-align: middle;
      line-height: 1;
      color: var(--text);
      background: rgba(255, 255, 255, 0.4);
      border: var(--glass-border);
      box-shadow: var(--shadow-soft);
      font-weight: 800;
      font-size: clamp(11px, .8vw, 13px);
      transition: transform 0.3s var(--ease-spring), box-shadow 0.3s var(--ease-smooth), background 0.2s var(--ease-smooth);
    }

    .calendar-roster-nav-btn {
      width: clamp(32px, 2.05vw, 38px);
      height: clamp(32px, 2.05vw, 38px);
      min-width: clamp(32px, 2.05vw, 38px);
      min-height: clamp(32px, 2.05vw, 38px);
      flex: 0 0 auto;
      padding: 0;
      font-size: clamp(18px, 1.25vw, 22px);
    }

    .calendar-roster-month-btn {
      min-width: clamp(104px, 7vw, 126px);
    }

    .calendar-roster-export-btn {
      min-width: clamp(86px, 5.8vw, 106px);
      color: #007aff;
      background: rgba(0, 122, 255, 0.15);
      border-color: rgba(0, 122, 255, 0.3);
    }

    body.dark-mode .calendar-roster-export-btn {
      color: #0a84ff;
      background: rgba(10, 132, 255, 0.2);
      border-color: rgba(10, 132, 255, 0.35);
      box-shadow: var(--shadow-soft);
    }

    .calendar-control-icon {
      width: 1em;
      height: 1em;
      display: block;
      flex: 0 0 auto;
      pointer-events: none;
      stroke: currentColor;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    .calendar-full-weekdays {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 6px;
    }

    .calendar-full-weekdays div {
      text-align: center;
      color: var(--muted);
