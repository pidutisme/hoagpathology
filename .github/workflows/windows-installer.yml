name: Build Windows Installer
on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run desktop:dist
      - uses: actions/upload-artifact@v4
        with:
          name: Hoag-Pathology-Windows-Installer
          path: dist-desktop/*.exe
