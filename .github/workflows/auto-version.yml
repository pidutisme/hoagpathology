name: Auto Version

on:
  push:
    branches:
      - main
    paths:
      - "index.html"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump-version:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Increment patch version
        id: version
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const file = "package.json";
          const pkg = JSON.parse(fs.readFileSync(file, "utf8"));

          const current = String(pkg.version || "2.1.0");
          const match = current.match(/^(\d+)\.(\d+)\.(\d+)$/);

          if (!match) {
            throw new Error(`Invalid version format: ${current}`);
          }

          const next =
            `${match[1]}.${match[2]}.${Number(match[3]) + 1}`;

          pkg.version = next;

          fs.writeFileSync(
            file,
            JSON.stringify(pkg, null, 2) + "\n"
          );

          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `previous=${current}\n`
          );

          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `next=${next}\n`
          );

          console.log(`Version: ${current} -> ${next}`);
          NODE

      - name: Update package-lock.json
        run: |
          npm install --package-lock-only --ignore-scripts

      - name: Commit and push updated version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add package.json package-lock.json

          if git diff --cached --quiet; then
            echo "No version changes to commit."
            exit 1
          fi

          git commit -m "chore: bump version to ${{ steps.version.outputs.next }}"

          git push origin HEAD:main

      - name: Create version tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag -a "v${{ steps.version.outputs.next }}" \
            -m "Release v${{ steps.version.outputs.next }}"

          git push origin "v${{ steps.version.outputs.next }}"

      - name: Summary
        run: |
          echo "## HOAG Pathology Version Updated" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Previous: ${{ steps.version.outputs.previous }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- New: ${{ steps.version.outputs.next }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tag: v${{ steps.version.outputs.next }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Main branch updated." >> "$GITHUB_STEP_SUMMARY"
          echo "- Windows installer workflow should start automatically from the new tag." >> "$GITHUB_STEP_SUMMARY"
