
name: Auto Version

on:
  push:
    branches:
      - main
    paths-ignore:
      - "package.json"
      - "VERSIONING.md"

permissions:
  contents: write

jobs:
  bump-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Increment patch version
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const file = "package.json";
          const pkg = JSON.parse(fs.readFileSync(file, "utf8"));
          const current = String(pkg.version || "2.1.4");
          const match = current.match(/^(\d+)\.(\d+)\.(\d+)$/);

          if (!match) throw new Error(`Invalid version: ${current}`);

          pkg.version = `${match[1]}.${match[2]}.${Number(match[3]) + 1}`;
          fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + "\n");

          console.log(`${current} -> ${pkg.version}`);
          NODE

      - name: Commit updated version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git diff --cached --quiet || git commit -m "chore: bump app version"
          git push
