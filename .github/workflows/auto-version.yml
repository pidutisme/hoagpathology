name: Auto Version

on:
  push:
    branches:
      - main
    paths-ignore:
      - "package.json"
      - "package-lock.json"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump-version:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Determine version bump
        id: version
        shell: bash
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const file = "package.json";
          const pkg = JSON.parse(fs.readFileSync(file, "utf8"));

          const current = String(pkg.version || "2.1.0");
          const match = current.match(/^(\d+)\.(\d+)\.(\d+)$/);

          if (!match) {
            throw new Error(`Invalid version format: ${current}`);
          }

          const major = Number(match[1]);
          const minor = Number(match[2]);
          const patch = Number(match[3]);

          const message = String(process.env.COMMIT_MESSAGE || "").trim();
          const eventName = String(process.env.EVENT_NAME || "");

          let bump = "patch";

          if (eventName === "workflow_dispatch") {
            bump = "patch";
          } else if (/^BREAKING:/i.test(message) || /BREAKING CHANGE:/i.test(message)) {
            bump = "major";
          } else if (/^feat(?:\([^)]+\))?!:/i.test(message) || /^feat(?:\([^)]+\))?:/i.test(message)) {
            bump = "minor";
          } else if (/^fix(?:\([^)]+\))?:/i.test(message)) {
            bump = "patch";
          } else {
            bump = "patch";
          }

          let nextMajor = major;
          let nextMinor = minor;
          let nextPatch = patch;

          if (bump === "major") {
            nextMajor++;
            nextMinor = 0;
            nextPatch = 0;
          } else if (bump === "minor") {
            nextMinor++;
            nextPatch = 0;
          } else {
            nextPatch++;
          }

          const next = `${nextMajor}.${nextMinor}.${nextPatch}`;

          pkg.version = next;

          fs.writeFileSync(
            file,
            JSON.stringify(pkg, null, 2) + "\n"
          );

          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `previous=${current}\n`
          );

          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `next=${next}\n`
          );

          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `bump=${bump}\n`
          );

          console.log(`Commit: ${message || "(manual run)"}`);
          console.log(`Bump: ${bump}`);
          console.log(`Version: ${current} -> ${next}`);
          NODE

      - name: Update package-lock.json
        run: |
          npm install --package-lock-only --ignore-scripts

      - name: Commit and push updated version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add package.json package-lock.json

          if git diff --cached --quiet; then
            echo "No version changes to commit."
            exit 1
          fi

          git commit -m "chore: bump version to ${{ steps.version.outputs.next }}"
          git push origin HEAD:main

      - name: Create version tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag -a "v${{ steps.version.outputs.next }}"             -m "Release v${{ steps.version.outputs.next }}"

          git push origin "v${{ steps.version.outputs.next }}"

      - name: Summary
        run: |
          echo "## HOAG Pathology Version Updated" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Previous: ${{ steps.version.outputs.previous }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- New: ${{ steps.version.outputs.next }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Bump: ${{ steps.version.outputs.bump }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: ${{ github.event.head_commit.message }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tag: v${{ steps.version.outputs.next }}" >> "$GITHUB_STEP_SUMMARY"
